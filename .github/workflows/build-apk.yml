name: Build MiniCPM-V Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official MiniCPM-V-Apps source
        uses: actions/checkout@v4
        with:
          repository: OpenBMB/MiniCPM-V-Apps
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and configure Android SDK (runner preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          echo "sdk.dir=$ANDROID_HOME" > src/MiniCPM-V-demo-Android/local.properties
          cat src/MiniCPM-V-demo-Android/local.properties

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          cd src/MiniCPM-V-demo-Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../build_log.txt
          exit ${PIPESTATUS[0]}

      - name: Record build metadata
        if: always()
        run: |
          {
            echo "=== Build Metadata ==="
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build_outcome: ${{ steps.build.outcome }}"
          } > build_meta.txt
          cat build_meta.txt

      - name: Copy APK to repo root
        if: steps.build.outcome == 'success'
        run: cp src/MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk ./minicpm-v-app-debug.apk

      - name: Commit artifacts and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bleemfjn-hub/minicpm-v-47-builder.git"
          ls -la
          test -f build_log.txt && echo "build_log.txt exists" || echo "NO build_log.txt"
          git add -f build_log.txt build_meta.txt minicpm-v-app-debug.apk 2>&1 || true
          git status
          git commit -m "ci: build artifacts and log [skip ci]" 2>&1 || echo "nothing to commit"
          git push origin HEAD:main 2>&1

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: minicpm-v-app-debug
          path: src/MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk
