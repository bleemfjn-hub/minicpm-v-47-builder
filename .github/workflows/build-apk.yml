name: Build MiniCPM-V Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo (this repo)
        uses: actions/checkout@v4

      - name: Checkout official MiniCPM-V-Apps source
        uses: actions/checkout@v4
        with:
          repository: OpenBMB/MiniCPM-V-Apps
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > src/MiniCPM-V-demo-Android/local.properties

      - name: Build Debug APK
        run: |
          cd src/MiniCPM-V-demo-Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Record build metadata
        run: |
          {
            echo "=== Build Metadata ==="
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "=== APK SHA-256 ==="
            sha256sum src/MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk
          } > build_output.txt
          cat build_output.txt

      - name: Copy APK to repo root
        run: cp src/MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk ./minicpm-v-app-debug.apk

      - name: Commit APK and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f minicpm-v-app-debug.apk build_output.txt
          git commit -m "ci: build artifacts [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minicpm-v-app-debug
          path: src/MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk
